<style>
:root{
  --bg:#F3F5F2; --card:#FFFFFF; --ink:#14231C; --muted:#4A5A52; --line:#D5DDD7;
  --green:#1F6F5C; --orange:#C2581F; --warn:#B3261E; --warnbg:#FCE9E7; --okbg:#E3F1EB;
  --dark:#10201A; --dark2:#1C3229; --darkline:#3A5A4C; --darkink:#EEF3EF; --darkmuted:#A9BDB2;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
body.dark{background:var(--dark);color:var(--darkink);padding-bottom:0}
h1{font-size:26px;margin:0}
h2{font-size:19px;margin:18px 0 8px}
header.top{padding:20px 16px 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
main{padding:0 16px 24px}
.muted{color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;min-height:44px;padding:0 14px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button.primary,.btn.primary{background:var(--orange);border-color:var(--orange);color:#fff}
button.green{background:var(--green);border-color:var(--green);color:#fff}
button.danger{color:var(--warn);border-color:#E4B8B4}
button.small{min-height:36px;padding:0 10px;font-size:14px}
button.block{width:100%}
label{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px}
input,select,textarea{font:inherit;width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;color:var(--ink)}
textarea{min-height:70px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:none;border-radius:0;background:#fff}
.seg button.on{background:var(--green);color:#fff}
.alert{border-radius:12px;padding:10px 12px;margin:10px 0;font-size:15px}
.alert.warn{background:var(--warnbg);color:#6B1610;border:1px solid #E4B8B4}
.alert.ok{background:var(--okbg);color:#123F33;border:1px solid #B7D8CB}
.alert.info{background:#FFF4E5;color:#5A3510;border:1px solid #F0D2AE}
.catch{display:flex;gap:12px;align-items:center}
.thumb{width:76px;height:76px;border-radius:10px;background:#C9D8CF;object-fit:cover;flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted)}
.big{font-size:17px;font-weight:700}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--okbg);color:var(--green)}
.tag.took{background:#FFF0E6;color:#8A3A10}
.stat{background:var(--bg);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px}
.stat b{font-size:20px}
.bar{height:10px;border-radius:5px;background:var(--green)}
.list-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:none}
.menu-grid button{height:84px;flex-direction:column;font-size:14px;text-align:center}
nav.bottom{position:fixed;left:0;right:0;bottom:0;height:calc(76px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;z-index:1000}
nav.bottom button{border:none;background:none;flex-direction:column;font-size:11px;gap:3px;color:var(--muted);min-height:60px;padding:0}
nav.bottom button.on{color:var(--green);font-weight:800}
nav.bottom button.plus{width:62px;height:62px;border-radius:31px;background:var(--orange);color:#fff;font-size:34px;justify-self:center;margin-top:-26px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
body.dark nav.bottom{display:none}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.photo-prev{width:100%;max-height:260px;object-fit:cover;border-radius:12px;margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.toast{position:fixed;left:16px;right:16px;bottom:100px;background:var(--ink);color:#fff;padding:12px 14px;border-radius:12px;z-index:2000;font-weight:600}

@media print{nav.bottom,.noprint{display:none!important}body{padding:0}.card{break-inside:avoid}}

<script>
'use strict';
/* ================= Dane stałe ================= */
const GATUNKI = ['Amur','Boleń','Brzana','Certa','Jaź','Jelec','Jesiotr','Karaś pospolity','Karaś srebrzysty','Karp','Kleń','Krąp','Leszcz','Lin','Lipień','Miętus','Okoń','Płoć','Pstrąg potokowy','Pstrąg tęczowy','Rozpiór','Sandacz','Sum','Szczupak','Świnka','Tołpyga','Ukleja','Węgorz','Wzdręga','Inny'];
const METODY = ['Spławik','Grunt','Method feeder','Feeder','Spinning','Karpiowa (włos)','Bat','Muchowa','Podlodowa','Inna'];
const KAT_WYDATKOW = ['Zezwolenie / składka','Łowisko komercyjne','Sprzęt','Przynęty i zanęty','Dojazd','Inne'];
const SPRZET_START = ['Wędki','Kołowrotki','Podbierak','Mata karpiowa','Siatka / worek','Zanęta','Przynęty','Haczyki i przypony','Ciężarki / koszyczki','Krzesełko','Parasol','Czołówka','Karta wędkarska i zezwolenie','Woda i jedzenie','Powerbank'];
// Źródło: Zasady amatorskiego połowu ryb PZW Okręg Wałbrzych 2025 (uchwała 205/2024), zasady wspólne dla Dolnego Śląska.
// min = chroniony do tej długości włącznie; max = wymiar górny (chroniony od); okresy: [od MM-DD, do MM-DD]
const PRZEPISY_START = {
 'Amur':{min:40,limit:'2 szt./dobę (łącznie z łososiowatymi, sandaczem, szczupakiem)'},
 'Boleń':{min:40},
 'Brzana':{min:40,okresy:[['01-01','06-30']],limit:'3 szt./dobę'},
 'Certa':{min:30,okresy:[['01-01','06-30']],limit:'5 szt./dobę'},
 'Głowacica':{min:70,okresy:[['03-01','05-31']],limit:'1 szt./tydzień'},
 'Jaź':{min:25},
 'Jelec':{min:15},
 'Karaś pospolity':{min:25,limit:'3 szt./dobę'},
 'Karp':{min:30,max:65,limit:'2 szt./dobę, 4/miesiąc, 30/rok'},
 'Kleń':{min:25},
 'Leszcz':{limit:'3 szt./dobę (zbiorniki zaporowe: 5)'},
 'Lin':{min:30,limit:'2 szt./dobę'},
 'Lipień':{zakaz:true,uwaga:'Całkowity zakaz zabierania.'},
 'Łosoś':{min:35,okresy:[['10-01','12-31']]},
 'Miętus':{min:25,okresy:[['12-01','02-29']]},
 'Okoń':{min:20,max:45},
 'Pstrąg potokowy':{min:25,max:45,okresy:[['09-01','12-31']],limit:'3 szt./dobę',uwaga:'Odra do ujścia Bystrzycy i Bystrzyca z dopływami: ochrona do 31.01.'},
 'Rozpiór':{min:25},
 'Sandacz':{min:55,max:85,okresy:[['01-01','05-31']],limit:'2 szt./dobę (z grupą), szczupak+sandacz 6/miesiąc, 35/rok'},
 'Sum':{min:70,okresy:[['01-01','05-31']]},
 'Szczupak':{min:55,max:85,okresy:[['01-01','04-30']],limit:'2 szt./dobę (z grupą), szczupak+sandacz 6/miesiąc, 35/rok',uwaga:'Z łodzi ochrona do 31.05.'},
 'Świnka':{min:30,okresy:[['01-01','05-15']]},
 'Węgorz':{min:60,okresy:[['12-01','03-31']],limit:'2 szt./dobę'},
 'Wzdręga':{min:15}
};
const ZRODLO_PRZEPISOW = 'Zasady PZW Okręg Wałbrzych 2025 (wspólne dla Dolnego Śląska). Sprawdź z zezwoleniem PZW Wrocław na bieżący rok i popraw w razie różnic.';

/* ================= Baza w telefonie (IndexedDB) ================= */
const STORES = ['catches','spots','trips','expenses','permits','rigs','sessions','notes','blobs','settings'];
let dbp = null;
function db(){
  if(dbp) return dbp;
  dbp = new Promise((res,rej)=>{
    const r = indexedDB.open('rybiorz',1);
    r.onupgradeneeded = ()=>{ for(const s of STORES) if(!r.result.objectStoreNames.contains(s)) r.result.createObjectStore(s,{keyPath:'id'}); };
    r.onsuccess = ()=>res(r.result); r.onerror = ()=>rej(r.error);
  });
  return dbp;
}
async function tx(store,mode,fn){
  const d = await db();
  return new Promise((res,rej)=>{
    const t = d.transaction(store,mode); const s = t.objectStore(store);
    const out = fn(s); t.oncomplete = ()=>res(out && 'result' in out ? out.result : out); t.onerror = ()=>rej(t.error);
  });
}
const all = (s)=>tx(s,'readonly',st=>st.getAll());
const get = (s,id)=>tx(s,'readonly',st=>st.get(id));
const put = (s,obj)=>tx(s,'readwrite',st=>st.put(obj));
const del = (s,id)=>tx(s,'readwrite',st=>st.delete(id));
const clearStore = (s)=>tx(s,'readwrite',st=>st.clear());
const uid = ()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
async function setting(key,def){ const r = await get('settings',key); return r ? r.value : def; }
const setSetting = (key,value)=>put('settings',{id:key,value});
async function przepisy(){ return Object.assign({},PRZEPISY_START, await setting('przepisy',{})); }

/* ================= Pomocnicze ================= */
const $ = (sel)=>document.querySelector(sel);
const esc = (s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = (n)=>String(n).padStart(2,'0');
const dataPL = (iso)=>{ if(!iso) return ''; const d=new Date(iso); return `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()}`; };
const godzPL = (iso)=>{ const d=new Date(iso); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const dzisISO = ()=>{ const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const lokalnyDT = (d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const num = (v)=>{ const n = parseFloat(String(v).replace(',','.')); return isNaN(n)?null:n; };
const kg = (n)=>n==null?'':n.toLocaleString('pl-PL',{maximumFractionDigits:2})+' kg';
const zl = (n)=>(n||0).toLocaleString('pl-PL',{minimumFractionDigits:2,maximumFractionDigits:2})+' zł';
const MIESIACE = ['styczeń','luty','marzec','kwiecień','maj','czerwiec','lipiec','sierpień','wrzesień','październik','listopad','grudzień'];
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }
function opts(list,sel){ return list.map(x=>`<option${x===sel?' selected':''}>${esc(x)}</option>`).join(''); }
function spotOpts(spots,sel){ return '<option value="">(bez łowiska)</option>'+spots.map(s=>`<option value="${s.id}"${s.id===sel?' selected':''}>${esc(s.name)}</option>`).join(''); }
function pozycja(){
  return new Promise(res=>{
    if(!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(p=>res({lat:+p.coords.latitude.toFixed(5),lon:+p.coords.longitude.toFixed(5)}),()=>res(null),{enableHighAccuracy:true,timeout:10000,maximumAge:60000});
  });
}
function odleglosc(a,b){ const R=6371,r=Math.PI/180; const dLat=(b.lat-a.lat)*r,dLon=(b.lon-a.lon)*r; const x=Math.sin(dLat/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLon/2)**2; return 2*R*Math.asin(Math.sqrt(x)); }
async function najblizszeLowisko(pos){
  if(!pos) return null; const spots = await all('spots'); let best=null,bd=1e9;
  for(const s of spots){ if(s.lat==null) continue; const d=odleglosc(pos,s); if(d<bd){bd=d;best=s;} }
  return bd<=1.5 ? best : null;
}
async function zdjecieDoBloba(file){
  const img = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=URL.createObjectURL(file); });
  const max=1600, sc=Math.min(1,max/Math.max(img.width,img.height));
  const c=document.createElement('canvas'); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(img.src);
  return new Promise(res=>c.toBlob(res,'image/jpeg',0.82));
}
const urlCache = {};
async function blobURL(id){ if(!id) return null; if(urlCache[id]) return urlCache[id]; const b = await get('blobs',id); if(!b) return null; return urlCache[id]=URL.createObjectURL(b.blob); }

/* ================= Słońce i księżyc (liczone w telefonie) ================= */
function slonce(date,lat,lon){
  // algorytm NOAA, wynik w czasie lokalnym telefonu
  const rad=Math.PI/180, d=new Date(date.getFullYear(),date.getMonth(),date.getDate(),12);
  const J = d/86400000 + 2440587.5, n = Math.round(J-2451545.0009-(-lon)/360);
  const Js = 2451545.0009+(-lon)/360+n, M=(357.5291+0.98560028*(Js-2451545))%360;
  const C=1.9148*Math.sin(M*rad)+0.02*Math.sin(2*M*rad)+0.0003*Math.sin(3*M*rad);
  const L=(M+102.9372+C+180)%360, Jt=Js+0.0053*Math.sin(M*rad)-0.0069*Math.sin(2*L*rad);
  const dec=Math.asin(Math.sin(L*rad)*Math.sin(23.44*rad));
  const cosH=(Math.sin(-0.833*rad)-Math.sin(lat*rad)*Math.sin(dec))/(Math.cos(lat*rad)*Math.cos(dec));
  if(cosH<-1||cosH>1) return null;
  const H=Math.acos(cosH)/rad/360, toDate=j=>new Date((j-2440587.5)*86400000);
  return {wschod:toDate(Jt-H), zachod:toDate(Jt+H)};
}
function ksiezyc(date){
  const syn=29.530588853, ref=Date.UTC(2000,0,6,18,14);
  let age=((date-ref)/86400000)%syn; if(age<0) age+=syn;
  const oswietlenie=Math.round((1-Math.cos(2*Math.PI*age/syn))/2*100);
  const fazy=[[1.85,'nów'],[5.54,'sierp przybywa'],[9.23,'pierwsza kwadra'],[12.92,'przybywa'],[16.61,'pełnia'],[20.3,'ubywa'],[23.99,'ostatnia kwadra'],[27.68,'sierp ubywa'],[30,'nów']];
  return {faza:fazy.find(f=>age<f[0])[1], oswietlenie, wiek:age};
}
function godzina(d){ return d?`${pad(d.getHours())}:${pad(d.getMinutes())}`:'–'; }

/* ================= Pogoda (Open-Meteo, darmowa, bez konta) ================= */
const KODY = {0:'bezchmurnie',1:'prawie bezchmurnie',2:'częściowe zachmurzenie',3:'pochmurno',45:'mgła',48:'mgła',51:'mżawka',53:'mżawka',55:'mżawka',61:'słaby deszcz',63:'deszcz',65:'ulewa',71:'śnieg',73:'śnieg',75:'śnieżyca',80:'przelotny deszcz',81:'przelotny deszcz',82:'ulewa',95:'burza',96:'burza z gradem',99:'burza z gradem'};
async function pobierzPogode(lat,lon){
  const u=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,pressure_msl,wind_speed_10m,weather_code,cloud_cover&hourly=pressure_msl&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,wind_speed_10m_max&wind_speed_unit=ms&timezone=auto&past_days=1&forecast_days=4`;
  const r = await fetch(u); if(!r.ok) throw new Error('pogoda'); const j = await r.json();
  const now = Date.now(); const times = j.hourly.time.map(t=>new Date(t).getTime());
  let idx = times.findIndex(t=>t>now); if(idx<0) idx=times.length-1; idx=Math.max(0,idx-1);
  const p3 = j.hourly.pressure_msl[Math.max(0,idx-3)], pNow=j.current.pressure_msl, pPlus = j.hourly.pressure_msl[Math.min(times.length-1,idx+6)];
  const zmiana = pNow-p3;
  const trend = zmiana>1.2?'rośnie':zmiana<-1.2?'spada':'stałe';
  return {temp:j.current.temperature_2m, cisnienie:Math.round(pNow), trend, zmiana3h:+zmiana.toFixed(1), prognoza6h:Math.round(pPlus),
    wiatr:j.current.wind_speed_10m, opis:KODY[j.current.weather_code]||'', chmury:j.current.cloud_cover, dni:j.daily, czas:new Date().toISOString()};
}
function ocenaDnia(p){
  // prosta ocena wędkarska: stabilne lub łagodnie spadające ciśnienie, umiarkowany wiatr, bez burzy
  let pkt=3, why=[];
  if(p.trend==='stałe'){pkt+=1;why.push('stabilne ciśnienie');}
  if(p.trend==='spada' && p.zmiana3h>-3){pkt+=1;why.push('ciśnienie łagodnie spada');}
  if(p.zmiana3h<=-3||p.zmiana3h>=3){pkt-=1;why.push('gwałtowna zmiana ciśnienia');}
  if(p.wiatr>=1.5&&p.wiatr<=6){pkt+=0.5;why.push('lekki wiatr');} else if(p.wiatr>9){pkt-=1;why.push('silny wiatr');}
  if(/burza/.test(p.opis)){pkt-=2;why.push('burza');}
  pkt=Math.max(1,Math.min(5,Math.round(pkt)));
  const slowo=['','słabo','raczej słabo','średnio','dobrze','bardzo dobrze'][pkt];
  return {pkt,slowo,why:why.join(', ')||'zwykłe warunki'};
}

/* ================= Router ================= */
const app = $('#app');
let mapa = null;
const widoki = {};
function idz(nazwa,param){ location.hash = param!=null ? `${nazwa}/${encodeURIComponent(param)}` : nazwa; }
async function render(){
  const [nazwa,param] = (location.hash.slice(1)||'dziennik').split('/');
  if(mapa){ mapa.remove(); mapa=null; }
  document.body.classList.toggle('dark', nazwa==='nadwoda');
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on', b.dataset.go===nazwa));

  window.scrollTo(0,0);

/* ================= Przypomnienia na starcie ================= */
async function przypomnienia(){
  const out=[]; const dzis=new Date(); dzis.setHours(0,0,0,0);
  const trips = await all('trips');
  for(const t of trips){ const d=new Date(t.date+'T00:00'); const dni=Math.round((d-dzis)/86400000);
    if(dni===0) out.push(`<div class="alert info">Dziś wyjazd: <b>${esc(t.spotName||t.title||'')}</b></div>`);
    if(dni===1) out.push(`<div class="alert info">Jutro wyjazd: <b>${esc(t.spotName||t.title||'')}</b>. <a href="#sprzet">Sprawdź listę sprzętu</a></div>`); }
  const permits = await all('permits');
  for(const p of permits){ if(!p.until) continue; const dni=Math.round((new Date(p.until+'T00:00')-dzis)/86400000);
    if(dni<0) out.push(`<div class="alert warn">Nieważne od ${dataPL(p.until)}: <b>${esc(p.name)}</b></div>`);
    else if(dni<=30) out.push(`<div class="alert info">Za ${dni} dni kończy się: <b>${esc(p.name)}</b> (${dataPL(p.until)})</div>`); }
  return out.join('');
}

async function sprawdzPrzepisy(gat,dl,data){
  const P = (await przepisy())[gat];
  if(!P) return `<div class="alert ok">Brak zapisanych przepisów dla gatunku „${esc(gat)}”. Sprawdź zezwolenie.</div>`;
  const problemy=[], info=[];
  if(P.zakaz) problemy.push(P.uwaga||'Zakaz zabierania.');
  if(P.min!=null){ if(dl!=null && dl<=P.min) problemy.push(`Za mała: chroniona do ${P.min} cm, a ma ${dl} cm.`); else info.push(`Wymiar ochronny: do ${P.min} cm.`); }
  if(P.max!=null){ if(dl!=null && dl>=P.max) problemy.push(`Za duża: od ${P.max} cm ryba jest chroniona (wymiar górny).`); else info.push(`Wymiar górny: od ${P.max} cm.`); }
  if(P.okresy && !isNaN(data)){ const md=`${pad(data.getMonth()+1)}-${pad(data.getDate())}`;
    for(const [od,doo] of P.okresy){ const w = od<=doo ? (md>=od&&md<=doo) : (md>=od||md<=doo);
      if(w) problemy.push(`Okres ochronny: ${od.split('-').reverse().join('.')}–${doo.split('-').reverse().join('.')}.`); else info.push(`Okres ochronny: ${od.split('-').reverse().join('.')}–${doo.split('-').reverse().join('.')}.`); } }
  if(P.limit) info.push(`Limit: ${P.limit}.`);
  if(P.uwaga && !P.zakaz) info.push(P.uwaga);
  if(dl==null && P.min!=null) info.unshift('Wpisz długość, a sprawdzę wymiar.');
  return problemy.length ? `<div class="alert warn"><b>Uwaga, tej ryby raczej nie wolno zabrać.</b><br>${problemy.map(esc).join('<br>')}<br><span style="font-size:13px">${info.map(esc).join(' ')}</span></div>`
    : `<div class="alert ok"><b>Wygląda w porządku.</b> ${info.map(esc).join(' ')}</div>`;
}

async function przelaczNagrywanie(btn,meta,po){
  if(nagrywanie){ nagrywanie.stop(); return; }
  let stream; try{ stream = await navigator.mediaDevices.getUserMedia({audio:true}); }catch(e){ return toast('Brak dostępu do mikrofonu'); }
  const rec = new MediaRecorder(stream); const kaw=[];
  rec.ondataavailable=e=>kaw.push(e.data);
  rec.onstop=async ()=>{ stream.getTracks().forEach(t=>t.stop()); nagrywanie=null; btn.classList.remove('rec'); btn.querySelector('span').textContent='Nagraj';
    const blob=new Blob(kaw,{type:rec.mimeType}); const bid=uid(); await put('blobs',{id:bid,blob,kind:'audio'});
    const pos = await pozycja();
    await put('notes',{id:uid(),time:new Date().toISOString(),audio:bid,lat:pos?.lat,lon:pos?.lon,...meta}); toast('Nagranie zapisane'); po&&po(); };
  rec.start(); nagrywanie=rec; btn.classList.add('rec'); btn.querySelector('span').textContent='Stop';
}

  <h2>Moje rekordy (wszystkie lata)</h2>
  ${Object.keys(rek).length?`<div class="card"><table><tr><th>Gatunek</th><th>Najcięższa</th><th>Najdłuższa</th><th>Szt.</th></tr>

widoki.codziala = async (spotId)=>{

  const rigs=await all('rigs'); const rigName=id=>(rigs.find(r=>r.id===id)||{}).name;
  const blok=(t,key,fmt)=>{ const r=ranking(key); const mx=r[0]?.[1].n||1; return `<h2>${t}</h2><div class="card">${r.length?r.map(([k,v])=>`<div class="row" style="margin:6px 0"><span style="width:130px;font-size:14px">${esc(fmt?fmt(k):k)}</span><div class="grow"><div class="bar" style="width:${v.n/mx*100}%"></div></div><span style="width:28px;text-align:right">${v.n}</span></div>`).join(''):'<span class="muted">Brak danych.</span>'}</div>`; };
  const godz={}; for(const c of cs){ const h=new Date(c.time).getHours(); const k=`${pad(h)}–${pad((h+1)%24)}`; godz[k]=(godz[k]||0)+1; }

  <div class="grid2"><div><label for="cLow">Łowisko</label><select id="cLow"><option value="">Wszystkie</option>${spots.map(s=>`<option value="${s.id}"${s.id===wyb?' selected':''}>${esc(s.name)}</option>`).join('')}</select></div>

  <p class="muted">Na podstawie ${cs.length} połowów.</p>
  ${blok('Przynęty','bait')}${blok('Metody','method')}${blok('Zanęty','groundbait')}${blok('Zestawy','rig',rigName)}
  <h2>Najlepsze godziny</h2><div class="card">${topG.length?topG.map(([k,n])=>`<div>${k}: <b>${n}</b></div>`).join(''):'<span class="muted">Brak danych.</span>'}</div></main>`;

  const d=dataISO.replace(/-/g,''); const nast=new Date(dataISO+'T00:00'); nast.setDate(nast.getDate()+1);
  const d2=`${nast.getFullYear()}${pad(nast.getMonth()+1)}${pad(nast.getDate())}`; const st=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  const tekst=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Rybiorz//PL','BEGIN:VEVENT',`UID:${uid()}@rybiorz`,`DTSTAMP:${st}`,`DTSTART;VALUE=DATE:${d}`,`DTEND;VALUE=DATE:${d2}`,`SUMMARY:${tytul.replace(/[,;]/g,' ')}`,`DESCRIPTION:${(opis||'').replace(/\n/g,'\\n').replace(/[,;]/g,' ')}`,
    'BEGIN:VALARM','TRIGGER:-PT12H','ACTION:DISPLAY',`DESCRIPTION:${tytul.replace(/[,;]/g,' ')}`,'END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
  pobierz(new Blob([tekst],{type:'text/calendar'}),'rybiorz-'+d+'.ics');
}
widoki.wyjazdy = async ()=>{
  const ts=(await all('trips')).sort((a,b)=>a.date.localeCompare(b.date)); const d=dzisISO();
  const prz=ts.filter(t=>t.date>=d), min=ts.filter(t=>t.date<d).reverse();
  const karta=t=>{ const k=ksiezyc(new Date(t.date+'T12:00')); return `<div class="card" onclick="idz('wyjazd','${t.id}')"><div class="row between"><b>${dataPL(t.date)}</b><span class="muted">${k.faza}</span></div><div>${esc(t.spotName||t.title||'')}</div>${t.note?`<div class="muted">${esc(t.note)}</div>`:''}</div>`; };
  app.innerHTML = naglowek('Wyjazdy',true)+`<main><button class="green block" onclick="idz('wyjazd','')">Zaplanuj wyjazd</button>
  <h2>Zaplanowane</h2>${prz.map(karta).join('')||'<div class="card muted">Brak.</div>'}<h2>Minione</h2>${min.slice(0,20).map(karta).join('')||'<div class="card muted">Brak.</div>'}</main>`;
};
widoki.wyjazd = async (id)=>{
  const spots=await all('spots'); const t = id ? await get('trips',id) : {id:uid(),date:dzisISO()};
  app.innerHTML = naglowek(id?'Wyjazd':'Nowy wyjazd',true)+`<main>
  <label for="tD">Data</label><input id="tD" type="date" value="${t.date}">
  <label for="tL">Łowisko</label><select id="tL">${spotOpts(spots,t.spotId)}</select>
  <label for="tT">Albo opis miejsca</label><input id="tT" value="${esc(t.title)}">
  <label for="tN">Notatka (z kim, plan, co zabrać)</label><textarea id="tN">${esc(t.note)}</textarea>
  <div id="astro" class="muted" style="margin-top:8px"></div>
  <button class="green block" id="zap" style="margin-top:14px">Zapisz</button>
  <button class="block" id="ics" style="margin-top:10px">Dodaj przypomnienie do kalendarza telefonu</button>
  ${id?'<button class="danger block" id="usun" style="margin-top:10px">Usuń</button>':''}</main>`;
  const astro=()=>{ const dt=new Date($('#tD').value+'T12:00'); const sp=spots.find(s=>s.id===$('#tL').value)||{lat:51.11,lon:17.03}; const s=slonce(dt,sp.lat??51.11,sp.lon??17.03); $('#astro').textContent=`Tego dnia: wschód ${godzina(s&&s.wschod)}, zachód ${godzina(s&&s.zachod)}, księżyc: ${ksiezyc(dt).faza}.`; };
  $('#tD').onchange=astro; $('#tL').onchange=astro; astro();
  const zbierz=()=>{ t.date=$('#tD').value; t.spotId=$('#tL').value; t.spotName=(spots.find(s=>s.id===t.spotId)||{}).name||''; t.title=$('#tT').value.trim(); t.note=$('#tN').value.trim(); };
  $('#zap').onclick=async()=>{ zbierz(); if(!t.date) return toast('Wybierz datę'); await put('trips',t); toast('Zapisane'); idz('wyjazdy'); };
  $('#ics').onclick=()=>{ zbierz(); ics('Ryby: '+(t.spotName||t.title||'wyjazd'),t.date,t.note); };
  if(id) $('#usun').onclick=async()=>{ if(!confirm('Usunąć wyjazd?')) return; await del('trips',id); idz('wyjazdy'); };
};

/* ================= 10. Wydatki ================= */
widoki.wydatki = async ()=>{
  const es=(await all('expenses')).sort((a,b)=>b.date.localeCompare(a.date)); const rok=new Date().getFullYear();
  const wRoku=es.filter(e=>e.date.startsWith(rok)); const suma=wRoku.reduce((a,e)=>a+e.amount,0);
  const kat={}; for(const e of wRoku) kat[e.cat]=(kat[e.cat]||0)+e.amount;
  app.innerHTML = naglowek('Wydatki',true)+`<main>
  <div class="card"><div class="muted">Razem w ${rok}</div><div style="font-size:32px;font-weight:800">${zl(suma)}</div>
  ${Object.entries(kat).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="row between"><span>${esc(k)}</span><b>${zl(v)}</b></div>`).join('')}</div>
  <h2>Dodaj wydatek</h2><div class="card">
  <div class="grid2"><div><label for="eK">Kwota (zł)</label><input id="eK" inputmode="decimal"></div><div><label for="eD">Data</label><input id="eD" type="date" value="${dzisISO()}"></div></div>
  <label for="eC">Kategoria</label><select id="eC">${opts(KAT_WYDATKOW)}</select>
  <label for="eO">Opis</label><input id="eO" placeholder="np. kołowrotek, łowisko Bażant">
  <button class="green block" id="zap" style="margin-top:12px">Dodaj</button></div>
  <h2>Historia</h2>${es.slice(0,60).map(e=>`<div class="card row between"><div><b>${zl(e.amount)}</b> <span class="muted">${esc(e.cat)}</span><div class="muted">${dataPL(e.date)} ${esc(e.desc)}</div></div><button class="small danger" data-del="${e.id}">Usuń</button></div>`).join('')||'<div class="card muted">Brak.</div>'}</main>`;
  $('#zap').onclick=async()=>{ const k=num($('#eK').value); if(!k) return toast('Wpisz kwotę'); await put('expenses',{id:uid(),amount:k,date:$('#eD').value,cat:$('#eC').value,desc:$('#eO').value.trim()}); toast('Dodane'); render(); };
  app.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{ if(!confirm('Usunąć wydatek?')) return; await del('expenses',b.dataset.del); render(); });
};

/* ================= 13. Zezwolenia ================= */
widoki.zezwolenia = async ()=>{
  const ps=(await all('permits')).sort((a,b)=>(a.until||'').localeCompare(b.until||'')); const d=dzisISO();
  app.innerHTML = naglowek('Zezwolenia',true)+`<main><p class="muted">Karta wędkarska, składka PZW, zezwolenia na łowiska. Przypomnę na ekranie startowym 30 dni przed końcem.</p>
  ${ps.map(p=>`<div class="card"><div class="row between"><b>${esc(p.name)}</b>${p.until&&p.until<d?'<span class="tag took">nieważne</span>':'<span class="tag">ważne</span>'}</div>
  <div class="muted">${p.until?'do '+dataPL(p.until):'bezterminowo'}${p.number?' · nr '+esc(p.number):''}</div>
  <div class="row" style="margin-top:8px">${p.until?`<button class="small" data-ics="${p.id}">Przypomnienie w kalendarzu</button>`:''}<button class="small danger" data-del="${p.id}">Usuń</button></div></div>`).join('')||'<div class="card muted">Brak.</div>'}
  <h2>Dodaj</h2><div class="card">
  <label for="zN">Nazwa</label><input id="zN" placeholder="np. Składka PZW Wrocław 2026">
  <div class="grid2"><div><label for="zD">Ważne do</label><input id="zD" type="date"></div><div><label for="zNr">Numer</label><input id="zNr"></div></div>
  <button class="green block" id="zap" style="margin-top:12px">Dodaj</button></div></main>`;
  $('#zap').onclick=async()=>{ const n=$('#zN').value.trim(); if(!n) return toast('Wpisz nazwę'); await put('permits',{id:uid(),name:n,until:$('#zD').value,number:$('#zNr').value.trim()}); render(); };
  app.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{ if(!confirm('Usunąć?')) return; await del('permits',b.dataset.del); render(); });
  app.querySelectorAll('[data-ics]').forEach(b=>b.onclick=()=>{ const p=ps.find(x=>x.id===b.dataset.ics); const dt=new Date(p.until+'T00:00'); dt.setDate(dt.getDate()-14);
    ics('Kończy się: '+p.name,`${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`,'Ważne do '+dataPL(p.until)); });
};

/* ================= 15. Eksport i kopia ================= */
function pobierz(blob,nazwa){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=nazwa; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000); }
function csv(wiersze){ return '\ufeff'+wiersze.map(r=>r.map(v=>{ const s=String(v??''); return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }).join(';')).join('\r\n'); }
const b64 = (blob)=>new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(blob); });
widoki.eksport = async ()=>{
  let miejsce=''; try{ const e=await navigator.storage.estimate(); miejsce=`Apka zajmuje ok. ${(e.usage/1048576).toFixed(1)} MB.`; }catch(e){}
  const trwale = navigator.storage?.persisted ? await navigator.storage.persisted() : false;
  const ost = await setting('ostatniaKopia',null);
  app.innerHTML = naglowek('Eksport i kopia',true)+`<main>
  <div class="alert ${trwale?'ok':'info'}">${trwale?'Telefon nie usunie danych apki sam z siebie.':'Telefon może kiedyś wyczyścić dane przy braku miejsca. Rób kopię.'} ${miejsce}</div>
  <div class="card"><div class="big">Pełna kopia</div><p class="muted">Wszystko razem ze zdjęciami i nagraniami, w jednym pliku. Zapisz go np. na OneDrive. ${ost?'Ostatnia kopia: '+dataPL(ost)+'.':'Jeszcze nie robiłeś kopii.'}</p>
  <button class="green block" id="kopia">Zrób kopię</button><button class="block" id="wczytaj" style="margin-top:10px">Wczytaj kopię</button><input id="plik" type="file" accept=".json,application/json" hidden></div>
  <div class="card"><div class="big">Excel</div><p class="muted">Połowy, wydatki i wyjazdy jako pliki CSV, otworzysz je w Excelu.</p>
  <div class="grid3"><button id="csvP">Połowy</button><button id="csvW">Wydatki</button><button id="csvJ">Wyjazdy</button></div></div>
  <div class="card"><div class="big">PDF</div><p class="muted">Dziennik do druku. W oknie drukowania wybierz „Zapisz jako PDF”.</p><button class="block" onclick="idz('druk')">Dziennik do PDF</button></div></main>`;
  $('#kopia').onclick=async()=>{ $('#kopia').textContent='Przygotowuję…'; const out={app:'rybiorz',wersja:1,data:new Date().toISOString(),dane:{}};
    for(const s of STORES){ const rows=await all(s); out.dane[s] = s==='blobs' ? await Promise.all(rows.map(async r=>({id:r.id,kind:r.kind,data:await b64(r.blob)}))) : rows; }
    pobierz(new Blob([JSON.stringify(out)],{type:'application/json'}),`rybiorz-kopia-${dzisISO()}.json`); await setSetting('ostatniaKopia',new Date().toISOString()); $('#kopia').textContent='Zrób kopię'; };
  $('#wczytaj').onclick=()=>$('#plik').click();
  $('#plik').onchange=async e=>{ const f=e.target.files[0]; if(!f) return; let j; try{ j=JSON.parse(await f.text()); }catch(er){ return toast('To nie jest plik kopii Rybiorza'); }
    if(j.app!=='rybiorz') return toast('To nie jest plik kopii Rybiorza');
    if(!confirm('Wczytać kopię? Obecne dane zostaną zastąpione danymi z kopii.')) return;
    for(const s of STORES){ await clearStore(s); for(const r of (j.dane[s]||[])){ if(s==='blobs'){ const blob=await (await fetch(r.data)).blob(); await put('blobs',{id:r.id,kind:r.kind,blob}); } else await put(s,r); } }
    toast('Kopia wczytana'); idz('dziennik'); };
  $('#csvP').onclick=async()=>{ const cs=(await all('catches')).sort((a,b)=>a.time.localeCompare(b.time)); const rigs=await all('rigs');
    pobierz(new Blob([csv([['Data','Godzina','Gatunek','Waga kg','Długość cm','Zabrana','Metoda','Przynęta','Zanęta','Zestaw','Łowisko','Temp °C','Ciśnienie hPa','Trend','Wiatr m/s','Księżyc','Szer.','Dł.','Notatka'],
      ...cs.map(c=>[dataPL(c.time),godzPL(c.time),c.species,c.weight!=null?String(c.weight).replace('.',','):'',c.length??'',c.kept?'tak':'nie',c.method,c.bait,c.groundbait,(rigs.find(r=>r.id===c.rig)||{}).name||'',c.spotName,c.weather?.temp??'',c.weather?.cisnienie??'',c.weather?.trend??'',c.weather?.wiatr??'',c.moon||'',c.lat??'',c.lon??'',c.note])])],{type:'text/csv'}),`rybiorz-polowy-${dzisISO()}.csv`); };
  $('#csvW').onclick=async()=>{ const es=(await all('expenses')).sort((a,b)=>a.date.localeCompare(b.date)); pobierz(new Blob([csv([['Data','Kwota zł','Kategoria','Opis'],...es.map(e=>[dataPL(e.date),String(e.amount).replace('.',','),e.cat,e.desc])])],{type:'text/csv'}),`rybiorz-wydatki-${dzisISO()}.csv`); };
  $('#csvJ').onclick=async()=>{ const ts=(await all('trips')).sort((a,b)=>a.date.localeCompare(b.date)); pobierz(new Blob([csv([['Data','Łowisko','Opis','Notatka'],...ts.map(t=>[dataPL(t.date),t.spotName,t.title,t.note])])],{type:'text/csv'}),`rybiorz-wyjazdy-${dzisISO()}.csv`); };
};
widoki.druk = async ()=>{
  const cs=(await all('catches')).sort((a,b)=>a.time.localeCompare(b.time));
  app.innerHTML = `<main style="padding-top:16px"><div class="noprint row" style="margin-bottom:12px"><button onclick="history.back()">← Wstecz</button><button class="green" onclick="print()">Drukuj / zapisz PDF</button></div>
  <h1>Rybiorz: dziennik połowów</h1><p class="muted">Stan na ${dataPL(new Date().toISOString())}, ${cs.length} połowów</p><div id="lista"></div></main>`;
  const l=$('#lista');
  for(const c of cs){ const u=await blobURL(c.photo); const d=document.createElement('div'); d.className='card catch';
    d.innerHTML=`${u?`<img class="thumb" src="${u}" alt="" style="width:110px;height:110px">`:''}<div><b>${esc(c.species)}${c.weight?', '+kg(c.weight):''}${c.length?', '+c.length+' cm':''}</b> · ${c.kept?'zabrana':'wypuszczona'}
    <div class="muted">${dataPL(c.time)} ${godzPL(c.time)} · ${esc(c.spotName||'')} · ${esc([c.method,c.bait,c.groundbait].filter(Boolean).join(', '))}</div>
    ${c.weather?`<div class="muted">${c.weather.temp}°C, ${c.weather.cisnienie} hPa (${c.weather.trend}), wiatr ${c.weather.wiatr} m/s${c.moon?', '+c.moon:''}</div>`:''}${c.note?`<div>${esc(c.note)}</div>`:''}</div>`; l.appendChild(d); }
};

/* ================= Start ================= */
(async()=>{
  try{ if(navigator.storage?.persist) await navigator.storage.persist(); }catch(e){}
  if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
  render();
})();
</script>
</body>
</html>
